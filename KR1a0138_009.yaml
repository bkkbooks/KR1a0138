body:
  text: 易圖明辨卷九德清胡渭撰卦變繫辭傳曰易之為書也不可逺為道也屢遷變動不居周流六虛上下無常剛柔相易不可為典要唯變所適白雲郭氏曰易之為道數遷而變動未嘗止周流六爻或以下而升上或由上而降下以剛易柔以柔易剛不可以常道拘也唯變所適而已此之謂易之道也漢上朱氏曰訟彖曰剛來而得中隨彖曰剛來而下柔蠱彖曰剛上而柔下噬嗑彖曰剛柔分動而明賁彖曰柔來而文剛分剛上而文柔無妄彖曰剛自外來而為主於內大畜彖曰剛上而尚賢咸彖曰柔上而剛下損彖曰損上益下又曰損剛益柔益彖曰損上益下又曰自上下下渙彖曰剛來而不窮柔得位乎外而上同節彖曰剛柔分而剛得中剛者陽爻也柔者陰爻也剛柔之爻或謂之來或謂之分或謂之上下所謂唯變所適也此虞氏蔡景君伏曼容蜀才李之才所謂自某卦來之說也東坡蘇氏曰凡易之所謂剛柔者皆本諸乾坤也乾施一陽於坤以化其一陰而生三子皆一陽而二陰凡三子之卦有言剛來者明此本坤也而乾來化之坤施一陰於乾以化其一陽而生三女皆一陰而二陽凡三女之卦有言柔來者明此本乾也而坤來化之東谷鄭氏汝諧曰易始於畫畫始於乾坤自乾坤而為八卦乾坤之變極矣自八卦而為六十四八卦之變極矣八卦皆乾坤所生六十四卦皆八卦所生此作易之本㫖也傳易者懼其說之簡易而無以自託於艱深之地於是有互體卦變之說又云乾坤大父母也復姤小父母也夫父母一也安得大小之别按參同契云乾坤者易之門尸衆卦之父母是衆卦皆生於乾坤也李邵為先天之學而其卦圖乃以復姤臨遁泰否壯觀皆為生卦之母則是顯背伯陽矣希夷之傳豈若是乎既失參同之㫖又非彖傳之意東谷譏之有以也彖傳曰泰小往大來吉亨則是天地交而萬物通也上下交而其志同也內陽而外陰內健而外順內君子而外小人君子道長小人道消也否之匪人不利君子貞大往小來則是天地不交而萬物不通也上下不交而天下無邦也內陰而外陽內柔而外剛內小人而外君子小人道長君子道消也黃氏象數論曰卦變之說由泰否二卦小往大來大往小來而見之而夫子彖傳所以發明卦義者於是為多固易中一大節目也上經三十卦反對之為十二卦下經三十四卦反對之為十六卦乾坤頤大過坎離中孚小過不可反對則反其竒偶以相配卦之體兩相反爻亦隨卦而變顧有於此則吉於彼則凶於此則當位於彼則不當位從反對中明此往來倚伏之理所謂兩端之執也行有無妄之守反有天衢之用時有豐亨之遇反有羇旅之悲非以此卦生彼卦也又非以此爻換彼爻也按易有聖人之道四變居一焉易窮則變變則通通則久變者易中之大義也觀孔子之言曰上下無常剛柔相易內陽而外陰內柔而外剛則凡彖傳之剛柔往來上下內外皆主卦變而言可知矣然諸儒概以一爻言之故唯三陰三陽之卦可通而二陰二陽之卦則不可通無妄剛自外來升柔以時升之類是也唯以反對言之則無不可通蓋卦可以該爻而爻不可以該卦卦變則爻隨而動矣坤索乾得震坎艮以一剛為主乾索坤得㢲離兌以一柔為主彖傳所稱剛柔或指卦或指爻隨文立義可也大抵三陰三陽泰否以卦言餘皆以爻言二陰二陽則必以卦言然其所主者陽卦之一剛陰卦之一柔耳右論古卦變虞仲翔卦變圖一陰一陽之卦各六皆自復姤而變復姤師初之二同人初之二謙初之三履初之三豫初之四小畜初之四比初之五大有初之五剝初之上夬初之上二陰二陽之卦各九皆自臨遁而變臨遁升初之三無妄初之三解初之四家人初之四坎初之五離初之五蒙初之上革初之上明夷二之三訟二之三震二之四㢲二之四屯二之五鼎二之五頤二之上大過二之上三陰三陽之卦各十皆自泰否而變泰否恆初之四益初之四井初之五噬嗑初之五蠱初之上隨初之上豐二之四渙二之四既濟二之五未濟二之五賁二之上困二之上歸妹三之四漸三之四節三之五旅三之五損三之上咸三之上四陰四陽之卦各九皆自大壯觀而變大壯觀重大過初之五重頤初之五重鼎初之上重屯初之上重革二之五重蒙二之五重離初之上重坎二之上兌三之五艮三之五睽三之上蹇三之上需四之五晉四之五大畜四之上萃四之上變例之卦二中孚小過凡變卦皆從乾坤來乾坤黃氏象數論曰古之言卦變者莫備於虞仲翔其法以兩爻相易主變動者止一爻四陰四陽即二陰二陽之卦也其變不收於臨遁之下者以用臨遁生卦則主變須二爻皆動而後餘卦可盡不得不别起觀壯有四陰四陽而不用五陰五陽之夬剝者以五陰五陽之卦已盡於姤復無所俟乎此也中孚小過為變例之卦何也中孚從二陰之卦則遁之二陰皆易位從四陰之卦則大壯三四一時俱上小過從二陽之卦則臨之二陽皆易位從四陰之卦則觀三四一時俱上所謂主變之卦以一爻升降者至此而窮故變例也猶反對之卦至乾坤坎離頤大過中孚小過而亦窮也虞氏之卦變脈絡分明如此當時所著周易注周易集林今既不𫝊其見於李鼎祚易解中者語焉不詳朱漢上據之以定虞氏卦變遂有此然彼否之異無怪趙汝梅謂其錯雜無統也某追尋其緒而後知漢上之誤然四陰四陽與二陰二陽畢竟相錯不能不有重出之卦此八卦者重於大壯者為大過鼎革離重於觀者為頤屯蒙坎其主變屬之臨遁乎屬之大壯觀乎抑兼屬之乎其說有時而窮也以彖傳證之如無妄之剛自外來遁之初三相易皆在內卦非外來晉之柔進上行觀之四五相易皆在上卦暌之柔進上行大壯三上相易柔為下行蹇之往得中觀三上相易不得為中皆不能合此虞氏之短也蘇子瞻言剛柔相易皆本諸乾坤程子亦專以乾坤言卦變本之蜀才曰此本乾卦此本坤卦荀爽曰謙是乾來之坤非創論也但三陰三陽之卦此往彼來顯然可見其他則來者不知何來往者不知何往如無妄剛自外來外卦之乾未嘗損一剛也而云自外來不已背乎故朱子曰程子専以乾坤言卦變然只是上下兩體皆變者可通若只一體變者則不通蓋已深中其病矣然較之虞氏而下鑿空為說者某以為獨優也右論虞氏卦變李挺之變卦反對圖乾坤二卦為易之門萬物之祖圖第一舊本曰功成無為圖乾老陽坤老陰乾坤相索三變六卦不反對圖第二坤體而乾來交頤小過坎乾體而坤來交大過中孚離乾卦一陰下生反對變六卦圖第三姤同人履夬有大畜小坤卦一陽下生反對變六卦圖第四復師謙剝比䂊乾卦下生二陰各六變反對變十二卦圖第五遁訟旡妄畜大需壯大暌兑革人家巽鼎坤卦下生二陽各六變反對變十二卦圖第六臨明夷升觀晉萃蹇艮蒙解震屯乾卦下生三陰各六變反對變十二卦圖第七否恆豐泰咸旅歸妹節既濟漸渙濟未坤卦下生三陽各六變反對變十二卦圖第八泰損賁否益嗑噬蠱井未濟隨困濟既林氏易裨傳外篇曰李挺之變卦反對圖八篇六十四卦相生圖一篇漢上朱氏以為康節之子伯溫傳之於河陽陳四丈陳傳之於挺之長楊郭氏序李氏象學先天卦變曰陳圖南以授穆伯長伯長以授李挺之挺之以授邵堯夫陳安民安民以授兼山卦變一義橫渠伊川罕言而兼山獨得之康節本為先天易學而觀物外篇亦曰體者八變用者六變是以八卦之象不易者四反易者二以六變而成八也不易者四謂乾坤坎離也變易者二謂震艮㢲兌也重卦之後不易者八反覆者二十八不易者乾坤坎離頤小過中孚大過變易者二十八餘五十六卦也以三十六變而成六十四也又曰乾坤之位可易也坎離名可易而位不可易也震㢲位可易而名不可易也兌與艮名位皆可易也離肖乾坎肖坤中孚肖乾頤肖離小過肖坤大過肖坎是以乾坤坎離中孚頤大小過皆不可易也又曰卦之反對皆六陽六陰也在易則六陽六陰者十有二對也去四正則八陽四陰八陰四陽者各六對也十陽二陰十陰二陽者各三對也此以三陰三陽為主而變也六陰六陽十二對者否變泰咸恆豐旅漸歸妹渙節既濟未濟六對四正初經則乾坤坎離重卦則頤中孚大過小過八陽四陰八陰四陽各六對者遁變大壯需訟無妄大畜暌家人兌革六對臨變觀明夷晉升萃蹇解艮震蒙屯六對十陽二陰十陰二陽各三對者姤變夬同人大有履小畜三對復變剝師比謙豫三對凡五十六也而此有三十對者否泰司啓閉之節既濟未濟當四隅之位所以重用一卦乾坤本也坎離用也乾坤坎離上篇之用也咸兌艮也恆震㢲也兌艮震㢲下篇之用也頤大過小過中孚二篇之正也故曰至哉文王之作易其得天地之用乎大抵卦變八圖陽在下者以升為變在上者以降為變故升降之對此為升則彼為降此為降則彼為升然康節先天之學不泥書言而猶有卦變之說何邪曰大易之道本之氣數之自然觀先天圖則可知出生之統體矣今六十四卦兩兩相比若近於反對者觀序卦之先後皆有深意要非三陰三陽反對不反對云者近世復有上經三十卦下經三十四卦反對不反對皆本八卦以求合於十有八變者其巧愈甚矣要之卦變之義易之一端耳若以為易道盡於是要非康節所以望後世者姑録之以為外篇之首顧氏日知録曰卦變之說不始於孔子周公繫損之六三已言之矣曰三人行則損一人一人行則得其友是六子之變皆出於乾坤無所謂自復姤臨遁而來者當從程傳蘇軾王炎皆同此說黃氏象數論曰虞仲翔之釋比曰師二上之五得位蜀才曰此本師卦六五降二九二升五亦已發其端矣特未以此通之於别卦也至李挺之所傳變卦反對圖可謂獨得其真而又與六十四卦相生圖並出則擇焉而不精也其後來知德頗以此說變而以反對者為綜竒偶相反者為錯於頤過八卦相反之外取反對者而亦復錯之不知竒偶相反之中暗寓反對非别出一義也若又有相反一義何以卦爻略不之及乎為卦爻之所不及者可以無待於補矣渭按大傳參伍以變錯綜其數主蓍策而言來氏斷章取義為錯綜圖殊非經㫖其說以為一左一右曰錯一上一下曰綜錯本圓圖自乾坤至復姤凡六十四綜本序卦自屯蒙至既濟未濟凡二十八此圖於經無所用故後不復著按六十四卦兩兩相比無不反對其陰陽相背者八卦雖無變體亦反對也反對實文王演卦之一義彖傳本此以釋經剛柔之往來上下一覽而得不可謂孔子之說非文王之說也李氏反對圖首列乾坤二卦為易之門則諸卦宜皆出於乾坤而乃乾坤下生之卦一陰生自姤一陽生自復二陰生自遁二陽生自臨三陰生自否三陽生自泰何其紛糾之甚也康節親受此圖故有乾坤大父母姤復小父母之說夫乾坤生六子是為八卦因而重之遂為六十四六十四卦皆乾坤之所生也姤復遁臨否泰同在六十四卦之中安能生諸卦乎然姤復以一爻升降其蹤跡猶可尋求遁臨否泰則兩三爻遞為升降而否泰二濟未免重出益雜亂而無章矣乾坤雖諸卦所自出第以象傳證之則唯三陰三陽者可通而二陰二陽者不可通不如専主反對之為得也康節以文王所演為後天則卦變似非先天之學然其論卦之反對曰乾坤本也坎離用也乾坤坎離上篇之用也咸兌艮也恆震㢲也兌艮震㢲下篇之用也此即參同契以乾坤坎離牝牡震㢲艮兌之意而乾坤大父母姤復小父母則又圓圖陽生子中陰生午中之精義也乃知卦變亦希夷所傳均屬先天之學故朱子附列於邵子六圖之後云李挺之六十四卦相生圖乾坤者諸卦之祖姤乾一交而為姤復坤一交而為復凡卦一陰五陽者皆自復卦而來復一爻五變而成五卦師謙豫比剝凡卦五陽一陰者皆自姤卦而來姤一爻五變而成五卦同人履小畜大有夬遁乾再交而為遁臨坤再交而為臨凡卦四陰二陽者皆自臨卦而來臨五復五變而成十四卦第一四變明夷震屯頤第二復四變升解坎蒙第三復三變小過萃觀第四復二變蹇晉第五復一變艮凡卦四陽二陰者皆自遁卦而來遁五復五變而成十四卦第一四變訟㢲鼎大過第二復四變無妄家人離革第三復三變中孚大畜大壯第四復二變睽需第五復一變兌否乾三交而為否泰坤三交而為泰凡卦三陰三陽者皆自泰卦而來泰三復三變而成九卦第一三變歸妹節損第二復三變豐既濟賁第三復三變恆井蠱凡卦三陽三陰者皆自否卦而來否三復三變而成九卦第一三變漸旅咸第二復三變渙未濟困第三復三變益噬嗑隨林氏易裨傳外篇曰李挺之六十四卦相生圖其傳授見於反對圖中漢上朱氏曰始虞氏卦變乾坤生坎離乾息而生復臨泰大壯夬坤消而生姤遁否觀剝自復來者一卦豫自明夷來者四卦明夷解升震自泰來者九卦蠱賁恆升井歸妹豐節既濟自大壯來者六卦需大畜大過睽鼎兌自夬來者一卦同人自遁來者五卦訟無妄家人革㢲自否來者八卦隨噬嗑咸益困漸渙未濟自觀來者五卦晉蹇頤萃艮自剝來者一卦謙而屯生於坎蒙生於艮比生於師頤小過生於晉睽生於大壯或生於無妄旅生於賁或生於噬嗑中孚生於訟小畜變需上履變訟初姤無生卦師比同人大有四卦闕李鼎祚取蜀才虞氏之書補其三卦大有闕而頤卦虞以為生於晉侯果以為生於觀今以此圖考之其合於圖者三十有六卦又時有所疑不合者二十有八卦夫自下而上謂之升自上而下謂之降升者生也息也降者消也陰生陽陽生陰陰復生陽陽復生陰升降消息循環無窮然不離於乾坤一生二二生三至於三極矣故曰乾坤大父母也姤復小父母也嘗考之諸儒之論相生者始於虞翻蜀才近世漢上朱氏用以解易然卦之六十有四由八卦相錯而成也未有先有復姤臨遁泰否而後有諸卦者傳曰八卦成列象在其中矣因而重之爻在其中矣考夫震㢲坎離艮兌相合而後成卦今謂震坎艮生於臨㢲離兌生於遁母乃顛倒而不通邪邵康節曰無極之前陰含陽也有象之後陽分陰也陰為陽之母陽為陰之父故母孕長男而為復父生長女而為姤是以陽起於復而陰起於姤也又曰易始於乾坤而交於復姤蓋剛交柔而為復柔交剛而為姤自此而變無窮矣由前之說則陽生於子陰生於午之義也由後之說則十二辟卦剛柔相摩之義也今論卦變相生之說曰易於賁曰柔來而文剛剛上而文柔節曰剛柔分而剛得中無妄曰剛自外來而為主於內大傳曰剛柔相推變在其中矣是故有斯義也要之六十四卦之變皆本於八卦而八卦之重又本於乾坤之竒偶今卦之反對則兼上下體六十四卦相生則専用下卦為變是亦一家之學耳謂易道盡在於是則未也姑取其大概著於篇黃氏象數論曰六十四卦相生圖不以觀壯四陰四陽之卦為主變可以無虞氏重出之失矣然臨遁自第二變以後主變之卦兩爻皆動在彖傳亦莫知適從又不如虞氏動以一爻之有定法也方實孫有易卦變合圖與相生圖同至兩爻交動則稍更其次序朱風林升分為內外體有自十辟卦所變者乾坤無變故十二辟卦去之為十卦一陽在內體自復變凡二卦師謙一陽在外體自剝變凡二卦豫比二陽在內體自臨變凡二卦升明夷二陽在外體自觀變凡二卦晉革二陽在內體一陽在外體自泰變凡九卦與相生圖同一陰在內體自姤變凡二卦同人履一陰在外體自夬變凡二卦小畜大有二陰在內體自遁變凡二卦無妄訟二陰在外體自大壯變凡二卦需大畜二陰在內體一陰在外體自否變凡九卦與相生圖同有自六子卦所變者二陽分在內外不處震之主爻者自震變蹇蒙不處坎之主爻者自坎變小過頤不處艮之主爻者自艮變解屯二陰分在內外不處㢲之主爻者自㢲變睽革不處離之主爻者自離變中孚大過不處兌之主爻者自兌變家人鼎各得二卦其自十辟卦所變者以一爻升降其自六子卦所變者以兩爻升降自三陰三陽而外主變之卦多所生之卦少何其頭緒之紛紜也渭按朱風林卦變支離破碎全屬杜撰而且於經無所用故後不復著按李挺之言卦變莫善於反對莫不善於相生反對者經之所有相生者經之所無也六十四卦相生圖蓋從乾坤三索之義而推之於六畫以為卦變純乾純坤一交而為姤復再交而為遁臨三交而為否泰是亦可以已矣而又以姤初之一陰復初之一陽遞升以訖於上遁臨之二陰二陽否泰之三陰三陽亦如之夫姤復以一爻主變猶有定法若遁臨否泰則兩爻俱動或獨升或同升主變者非一紛然而無統紀矣且六子純卦亦不過因而重之今乃謂震坎艮生於臨㢲離兌生於遁有是理乎甚矣此圖之為贅疣也邵子皇極經世書曰天地之本其起於中乎是以乾坤屢變而不離乎中也又曰自下而上謂之升自上而下謂之降升者生也降者消也故陽生於下陰生於上是以萬物皆反生也又曰陰生陽陽生陰陰復生陽陽復生陰是以循環而無窮也乾坤吟曰道不逺於人乾坤只在身誰能天地外别去覔乾坤俞氏曰乾坤陰陽之純坎離陰陽之交乾純陽為天故居中之上坤純陰為地故居中之下坎陰中含陽為月離陽中含陰為日故居乾坤之中其餘六十卦自坤中一陽之生而至五陽則升之極矣遂為六陽之純乾自乾中一陰之生而至五陰則降之極矣遂為六陰之純坤一升一降上下往來蓋循環而無窮也天地如此人身亦如此子時氣到尾閭丑寅在腰間卯辰已在脊膂午在泥丸未申酉在胸膈戌亥則又歸於腹中此一日之升降然也一息亦然呼則自下而升於上吸則自上而降於下在天則應星而如斗指子午在地則應潮而如月在子午子午蓋天地之中也參同契云合符行中又云運移不失中又云浮游守規中人能知吾身之中以合乎天地之中則乾坤不在天地而在吾身矣按希夷先天之學參同契之的𫝊也伯陽所言無非丹道其曰二用無爻位周流行六虛往來既不定上下亦無常蓋借易剛柔往來上下以明人身二氣之升降與夫子彖傳所言不同指而李氏六十四卦相生圖於丹道絶無交涉安在其為先天邪竊疑穆修受學於希夷唯有反對圖而相生則李氏以意為之頗緣飾以儒者之義理故其圖倣佛虞仲翔多與彖傳相合唯石澗直圖上乾下坤而坎離居中正得乾坤為鼎器坎離為藥物之意又據邵子天根月窟之說自坤中一陽生而升至五陽遂為六陽之純乾自乾中一陰生而降至五陰遂為六陰之純坤一升一降上下往來與伯陽之義吻合且諸卦皆生於乾坤無姤復小父母之疵而四陰二陽與坎並列四陽二陰與離並列亦皆井然有條理無重出之病勝李氏二圖逺甚然石澗未嘗自名為卦變也第因邵子有橫圖圓圖方圖而更作先天直圖以申其意自余觀之此圖既非六十四卦之次序又非六十四卦之方位正可作卦變圖耳異哉石澗能於三百餘嵗後紹聞知之統使呼吸上下往來之象一望瞭然真希夷先天之學而邵子之所不及圖者也故附列李氏二圖之末以質於後之君子右論李氏卦變朱子卦變圖本義圖說曰彖傳或以卦變為說今作此圖以明之蓋易中之一義非畫卦作易之本指也凡一陰一陽之卦各六皆自復姤而來五陰五陽卦同圖異剝比豫謙師復夬大有小畜履同人姤凡二陰二陽之卦各十有五皆自臨遁而來四陰四陽卦同圖異頤屯震明夷臨蒙坎解升艮蹇小過晉萃觀大過鼎㢲訟遁革離家人無妄兌睽中孚需大畜大壯凡三陰三陽之卦各二十皆自否泰而來損節歸妹泰賁既濟豐噬嗑隨益蠱井恆未濟困渙旅咸漸否咸旅漸否困未濟渙井蠱恆隨噬嗑益既濟賁豐歸妹泰凡四陰四陽之卦各十有五皆自大壯觀而來二陰二陽圖已見前大畜需大壯睽兌中孚離革益無妄鼎大過㢲訟遁萃晉觀蹇艮小過坎蒙解升屯頤震明夷臨凡五陰五陽之卦各六皆自夬剝而來一陰一陽圖已見前大有夬小畜履同人姤比剝豫謙師復黃氏象數論曰朱子言以彖傳考之說卦變者凡十九卦蓋言成卦之由彖傳不言成卦之由則不言所變之爻此是朱子自言其卦變也繫辭傳曰爻者言乎變者也易中何卦不言變辭有隱顯而理無不寓即證之彖辭亦非止十九卦也訟剛來而得中以需之反對觀之彼得正又得中此但得中不能得正泰否之往來所謂反其類隨剛來而下柔蠱剛上而柔下二卦反對蠱上之剛自外卦來初居二三之下隨初剛自下而上上柔自上而下噬嗑柔得中而上行賁柔來而文剛分剛上而文柔前卦謂六二上行為五後卦言六五自外卦而入內初九從下卦而至上無妄剛自外而為主於內大畜剛上而尚賢無妄之初九自大畜上爻外卦來為內卦之主大畜之上九自無妄初爻而上咸柔上剛下恆剛上柔下咸指上六九三恆指九四初六晉柔進而上行明夷之六二上行為六五睽柔進而上行家人之六二上行為六五蹇往得中也解其來復吉乃得中也蹇之九五自解內卦故曰往解之九二自蹇外卦故曰來升柔以時升升上卦之柔皆萃卦所升鼎柔進而上行鼎五由萃二而上漸進得位漸九五當歸妹居二為不得位渙剛來而不窮者節五來二柔得位乎外而上同者柔在三失位在四得位此朱子所謂十九卦之彖辭皆以反對為義者也需位乎天位以正中也自訟九二而來得中又得正損損下益上其道上行益損上益下自上下下由損觀之似以三爻益上爻由益觀之似以四爻益初爻小畜密雲不雨反對為履履下之兌澤氣成雲故曰密雲兌變而㢲風以散之故曰不雨大有應乎天而時行方其同人在二之時應乎天也今時行而居其位謙地道卑而上行地道指坤豫在下卦為卑謙在上卦為上行臨至於八月觀二陽在上臨二陽在下自臨至觀歷八爻故言八月復七日來復剝一陽在上復一陽在下自剝至復歷七爻故言七日明夷初登於天言晉後入於地言明夷夬所尚乃窮對姤為言井改邑不改井兌為剛鹵之地變而為㢲則近利市三倍是改邑也坎不變是不改井也皆對困言之歸妹征凶位不當也漸之二五皆當位至歸妹皆不當旅柔得中乎外在豐為得中乎內㢲柔皆順乎剛兌剛中而柔外兌柔不順乎剛㢲柔中而剛外二卦相反既濟剛正而位當未濟不當位二卦亦相反此朱子十九卦以外亦皆以反對為義者也反對之窮而反其竒偶以配之又未嘗不暗相反對於其間如中孚上爻之翰音反對即為小過初爻之飛鳥頤之口實由大過之兌大過士夫老夫由頤之艮震此序卦之不可易也奈何諸儒之為卦變紛然雜出而不能歸一乎朱子變卦圖一陰一陽與五陰五陽相重出二陰二陽與四陰四陽相重出泰與否相重出除乾坤之外其為卦百二十有四蓋已不勝其煩矣易之上下往來皆以一爻升降為言既有重出則每卦必有二來從其一則必舍其一以彖傳附㑹之有一合必有一不合就其所謂一來者尚有兩爻俱動并其二來則動者四爻矣原諸儒卦變之意所以明其自復姤臨遁否泰大壯觀夬剝而來者以其卦惟此一爻之故變為别卦是以脈絡可尋而定為主變使一卦之中頭緒紛然爻爻各操其柄則彼卦之體已不復存猶可認其自某所而來乎朱子雖為此圖亦自知其決不可用所釋十九卦彖辭盡舍主變之卦以兩爻相比者互換為變訟則自遁二三相換泰則自歸妹三四相換否則自漸三四相換隨則自困初二相換自噬嗑五上相換自未濟初與二五與上相換蠱則自賁初二相換自井五上相換自既濟初與二五與上相換噬嗑則自益四五相換賁則自損二三相換自既濟五上相換無妄則自訟初二相換大畜則自需五上相換咸則自旅五上相換恆則自豐初二相換晉則自觀四五相換睽則自離二三相換自中孚四五相換自家人二與三四與五相換蹇則自小過四五相換解則自升升則自解皆三四相換鼎則自㢲四五相換漸則自渙二三相換自旅四五相換渙則自漸二三相換凡十九卦而主變者二十有七或來自一卦或來自兩卦三卦多寡不倫絶無義例就以其法推之此十九卦中朱子之所舉者亦有未盡訟之自無妄初二相換自㢲三四相換隨之自既濟三四相換蠱之自未濟三四相換噬嗑之自未濟初二相換自賁三四相換自隨五上相換賁之自蠱初二相換自噬嗑三四相換無妄之自家人三四相換大畜之自睽三四相換咸之自困二三相換恆之自井四五相換晉之自艮三四相換自萃五上相換睽之自大畜三四相換自兌五上相換蹇之自坎二三相換自萃三四相換自艮五上相換解之自震初二相換自小過二三相換自坎四五相換升之自明夷初二相換鼎之自離初二相換自大過五上相換漸之自否三四相換渙之自益初二相換自未濟四五相換復得二十九卦而兼之者不與焉此二十九卦者以為有用乎則為彖辭之所不及以為無用乎不應同一卦變在一卦中其可以附㑹彖辭者從而取之其不可以附㑹彖辭者從而置之朱子云某之說却覺得有自然氣象者安在也且易所謂往來上下者自內之外謂往自外之內謂來上者上卦也下者下卦也今兩爻互換同在內卦而謂之往同在外卦而謂之來同在上卦而曰下同在下卦而曰上即欲附㑹之而有所不能矣是朱子之卦變兩者俱為無當宜乎其說之不能歸一也按邵子言重卦不易者八反復者二十八以三十六變而為六十四卦變之義數言盡之矣據此以釋彖傳亦足矣李挺之相生圖已傷煩碎況朱子之所定乎梨洲一一指擲無微不彰但朱子専取十九卦者第就彖傳所謂剛柔往來上下內外者而求之其它則未暇及梨洲續舉諸卦中唯損益二卦似不當遺何也彖傳曰損剛益柔又曰損下益土其道上行又曰損上益下自上下下則剛柔上下之義備矣正可與十九卦並舉何獨遺之其它只言剛柔而不言往來上下則其義即本卦可見不必求之卦變固不在此例然朱子欲以卦變附先天之後當仍用李氏反對圖猶不失希夷本指今乃據相生圖以更定其法煩碎甚於李氏而及其釋經也則又舍反對之卦而泛泛焉以兩爻相比者互換為變往來上下訖無定法亦安用此圖為也經於六十四卦之首各列二體六畫即卦變圖也剛柔往來之義開卷了然何以别圖為或曰誠用反對則每卦必顛倒視之而後可以知彖傳之所謂不亦勞乎余曰人之眼光雖至短兩卦相去尺幅間豈不能兼矚而必須顛倒以視之此言真兒童之見疑乎其所不足疑右論朱子卦變易圖明辨卷九
