body:
  text: 易圖明辨題辭古者有書必有圖圖以佐書之所不能盡也凡天文地理鳥獸草木宫室車旗服飾器用世系位著之類非圖則無以示隱賾之形明古今之制故詩書禮樂春秋皆不可以無圖唯易則無所用圖六十四卦二體六爻之畫即其圖矣白黑之點九十之數方圓之體復姤之變何為哉其卦之次序方位則乾坤三索出震齊巽二章盡之矣圖可也安得有先天後天之别河圖之象自古無傳從何擬議洛書之文見於洪範奚關卦爻五行九宫初不為易而設參同契先天太極特借易以明丹道而後人或指為河圗或指為洛書妄矣妄之中又有妄焉則劉牧所宗之龍圖蔡元定所宗之關子明易是也此皆偽書九十之是非又何足校乎故凡為易圖以附益經之所無者皆可廢也就邵子四圖論之則橫圖義不可通而圓圖别有至理何則以其為丹道之所寓也俞琰曰先天圖雖易道之緒餘亦君子養生之切務人曰丹家之説雖出於易不過依倣而託之者初非易之本義因作易外别傳以明之故吾謂先天之圖與聖人之易離之則雙美合之則兩傷伊川不列於經首固所以尊聖人亦所以全陳邵也觀吾書者如以為西山之戎首紫陽之罪人則五百年來有先我而當之者矣吾其可末減也夫康熙丙戌上已七十四叟東樵胡渭書於顒溪客舍欽定四庫全書經部一易圗明辨目録易類卷一河圗洛書卷二五行九宫卷三周易參同契先天太極卷四龍圗易數鉤隱圗卷五啓蒙圗書卷六先天古易上卷七先天古易下卷八後天之學卷九卦變卷十象數流弊臣等謹案易圖明辨十卷國朝胡渭撰渭原名渭生字朏明號東樵德清人是書專為辨定圖書而作初陳摶惟闡易理衍為諸圖其圖本凖易而生故以卦爻反覆研求無不符合傳者務神其説遂歸其圖於伏羲謂易反由圖而作又因繫詞河圖洛書之文取大衍算數作五十五點之圖以當河圖取乾鑿度太乙九宫法造四十五點之圖以當洛書其隂陽竒偶亦一一與易相應傳者益神其説又真以為龍馬神龜之所負謂伏羲由此而有先天之圖實則唐以前書絶無一字之符驗而突出于北宋之初夫測中星而造儀器以驗中星無不合然不可謂中星生于儀器也候交食而作算經以驗交食無不合然不可謂交食生於算經也由邵子以及朱子亦但取其數之巧合而未暇究其太古以來從誰授受故易學啓蒙及易本義前九圖皆沿其説同時袁樞薛季宣皆有異論然考宋史儒林傳易學啓蒙朱子本屬蔡元定創稿非所自撰晦菴大全集中載答劉君房書曰啓蒙本欲學者且就大傳所言卦畫蓍數推尋不須過為浮説而自今觀之如河圖洛書亦不免尚有剩語至於本義卷首九圖王懋竑白田雜著以文集語類鉤稽參考多相矛盾信其為門人所依附其説尤明則朱子當日亦未嘗堅主其説也元陳應潤作爻變易藴始指先天諸圖為道家假借易理以為修煉之術吳澄歸有光諸人亦相繼排擊各有論述國朝毛竒齡作圖書原舛編黃宗羲作易學象數論黃宗炎作圖書辨惑爭之尤力然皆各據所見抵其罅隙尚未能窮溯本末一一抉所自來渭此書卷一辨河圖洛書卷二辨五行九宫卷三辨周易參同先天太極卷四辨龍圖易數鉤隱圖卷五辨啓蒙圖書卷六卷七辨先天古易卷八辨後天之學卷九辨卦變卷十辨象數流弊皆引據舊文互相參證以箝依托者之口使學者知圖書之説雖言之有故執之成理乃修煉術數二家旁分易學之支流而非作易之根柢視所作禹貢錐指尤為有功於經學矣乾隆四十六年二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
